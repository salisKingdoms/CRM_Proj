services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  ws_crm:
    build:
      context: ./WS_CRM
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5001:8080"
    depends_on:
      - postgres

  ws_employee:
    build:
      context: ./WS_CRM_Employee
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5002:8080"
    depends_on:
      - postgres

  ws_customer:
    build:
      context: ./WS_CRM_Customer
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5003:8080"
    depends_on:
      - postgres

  ws_catalog:
    build:
      context: ./WS_CRM_Catalog
      dockerfile: Dockerfile
    command: ["sh", "-c", "ls -la && dotnet WS_CRM_Catalog.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5004:8080"
    depends_on:
      - postgres